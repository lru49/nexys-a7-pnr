name: pnr
on:
  workflow_dispatch:
    inputs:
      variant: { description: "nets/<variant>", required: true }
      seeds:   { description: "comma-separated seeds (used only when groups is empty: one job, per_job seeds at a time)", required: false, default: "1" }
      groups:  { description: "JSON list of seed groups, one job each, seeds of a group run in parallel, e.g. [\"1 2 3 4\",\"5 6 7 8\"] (built by the dispatcher)", required: false, default: "" }
      freq:    { description: "target MHz", required: true, default: "62.5" }
      extra:   { description: "extra nextpnr options", required: false, default: "" }
      maxiter: { description: "kill the router after this many iterations (0 = never)", required: false, default: "60" }
      nextpnr: { description: "release = the openXC7 release binary; r43 = openXC7/nextpnr 8006fbc6f8f7 + patches/nextpnr-r43.patch, built here; np31 = r43 + patches/nextpnr-np31.patch (env-gated placer knobs)", required: false, default: "release" }
      npenv:   { description: "environment for nextpnr, e.g. NP_TMG_K=20 NP_TMG_CAP=0 (np31 knobs)", required: false, default: "" }
      tune:    { description: "per-job knobs: threads per seed, parallel seeds, wall-time kill per seed in minutes", required: false, default: "threads=1 per_job=4 wallmin=45" }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ inputs.nextpnr == 'r43' || inputs.nextpnr == 'np31' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: patches
      - id: k
        env: { NPV: "${{ inputs.nextpnr }}" }
        run: |
          P=patches/nextpnr-r43.patch; [ "$NPV" = np31 ] && P="$P patches/nextpnr-np31.patch"
          echo "key=nextpnr-8006fbc6f8f7-$(cat $P | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: c
        with:
          path: /home/runner/npr
          key: ${{ steps.k.outputs.key }}
      - name: build nextpnr-xilinx (himbaechel) from public source + patch
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev libboost-system-dev libeigen3-dev ninja-build cmake
          git clone -q https://github.com/openXC7/nextpnr /tmp/nextpnr
          cd /tmp/nextpnr && git checkout -q 8006fbc6f8f7
          git apply "$GITHUB_WORKSPACE/patches/nextpnr-r43.patch"
          if [ "${{ inputs.nextpnr }}" = np31 ]; then git apply "$GITHUB_WORKSPACE/patches/nextpnr-np31.patch"; fi
          git diff --stat
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=himbaechel -DHIMBAECHEL_UARCH=xilinx \
            -DHIMBAECHEL_XILINX_DEVICES="" -DHIMBAECHEL_PRJXRAY_DB=/tmp/no-prjxray-db -DBUILD_PYTHON=OFF -DBUILD_GUI=OFF
          cmake --build build -j 4
          mkdir -p "/home/runner/npr" && cp build/nextpnr-himbaechel "/home/runner/npr/"
      - run: |
          sudo apt-get install -y -qq libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev > /dev/null
          ls -la /home/runner/npr && /home/runner/npr/nextpnr-himbaechel --version
  pnr:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(inputs.groups || format('["{0}"]', inputs.seeds)) }}
    env:
      VARIANT: ${{ inputs.variant }}
      GROUP: ${{ matrix.group }}
      TUNE: ${{ inputs.tune }}
      FREQ: ${{ inputs.freq }}
      EXTRA: ${{ inputs.extra }}
      MAXITER: ${{ inputs.maxiter }}
      NEXTPNR: ${{ inputs.nextpnr }}
      NPENV: ${{ inputs.npenv }}
      OXC: /home/runner/oxc
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nets/${{ inputs.variant }}
            patches
      - id: k
        if: ${{ inputs.nextpnr == 'r43' || inputs.nextpnr == 'np31' }}
        env: { NPV: "${{ inputs.nextpnr }}" }
        run: |
          P=patches/nextpnr-r43.patch; [ "$NPV" = np31 ] && P="$P patches/nextpnr-np31.patch"
          echo "key=nextpnr-8006fbc6f8f7-$(cat $P | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: ${{ inputs.nextpnr == 'r43' || inputs.nextpnr == 'np31' }}
        with:
          path: /home/runner/npr
          key: ${{ steps.k.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/cache@v4
        with:
          path: /home/runner/oxc
          key: openxc7-linux-x86-64-20261012
      - name: toolchain
        run: |
          if [ ! -x "$OXC/bin/nextpnr-xilinx" ]; then
            mkdir -p "$OXC"
            curl -sSL -o /tmp/oxc.tgz https://github.com/cavearr/toolchain-openxc7-releases/releases/download/2026-10-12/openxc7-toolchain-linux-x86-64-20261012.tgz
            echo "a0d583457dee3644fdca83e556a8106c58aba5fb88f23e30f1270f3a309d0ec8  /tmp/oxc.tgz" | sha256sum -c -
            tar -xzf /tmp/oxc.tgz -C "$OXC" && rm /tmp/oxc.tgz
          fi
          "$OXC/bin/nextpnr-xilinx" --version
          if [ "$NEXTPNR" != release ]; then sudo apt-get install -y -qq libboost-program-options1.83.0 libboost-iostreams1.83.0 libboost-thread1.83.0 libboost-filesystem1.83.0 >/dev/null 2>&1 || sudo apt-get install -y -qq libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev; "/home/runner/npr/nextpnr-himbaechel" --version; fi
      - id: g
        name: seed group
        run: |
          G=$(echo "$GROUP" | tr ',' ' ' | xargs); echo "seeds=$G" >> "$GITHUB_OUTPUT"; echo "first=${G%% *}" >> "$GITHUB_OUTPUT"
          echo "group: $G"; lscpu | grep -E 'Model name|Thread|Core|Socket|^CPU\(s\)'; free -g
          [ -x /usr/bin/time ] || sudo apt-get install -y -qq time >/dev/null
      - name: place and route (seeds of the group in parallel)
        env: { SEEDS: "${{ steps.g.outputs.seeds }}" }
        run: |
          threads=1; per_job=4; wallmin=45; for kv in $TUNE; do case $kv in threads=[0-9]*|per_job=[0-9]*|wallmin=[0-9]*) [[ ${kv#*=} =~ ^[0-9]+$ ]] && eval "${kv%%=*}=${kv#*=}";; esac; done
          echo "threads=$threads per_job=$per_job wallmin=$wallmin seeds=$SEEDS"
          mkdir -p out && cd out && ln -sfn ../nets nets   # so extra '-o preplaced=../nets/...' still resolves from out/s<seed>
          NPR="$OXC/bin/nextpnr-xilinx"; [ "$NEXTPNR" != release ] && NPR="/home/runner/npr/nextpnr-himbaechel"
          one() {   # $1 = seed; runs in out/s$1
            local S=$1 T0=$SECONDS PID; mkdir -p s$S && cd s$S
            gunzip -c "../../nets/$VARIANT/top.json.gz" > top.json; cp "../../nets/$VARIANT/pins.xdc" .
            echo "binary: $NPR ($NEXTPNR) env: $NPENV threads: $threads seed: $S" > pnr.log
            env $NPENV /usr/bin/time -v -o time.log "$NPR" --device xc7a100tcsg324-1 \
              --chipdb "$OXC/share/nextpnr/himbaechel/xilinx/chipdb-xc7a100t.bin" \
              --json top.json --freq "$FREQ" --seed "$S" --threads "$threads" $EXTRA --timing-allow-fail \
              -o xdc=pins.xdc -o fasm=top.fasm --report report.json >> pnr.log 2>&1 &
            PID=$!
            while kill -0 $PID 2>/dev/null; do
              sleep 20
              if [ "${MAXITER:-0}" -gt 0 ] && [ "$(grep -c ' wires=' pnr.log)" -gt "$MAXITER" ] && ! grep -q 'Routing complete' pnr.log; then
                echo "early-kill: router passed $MAXITER iterations" >> pnr.log; pkill -TERM -P $PID; break
              fi
              if [ $((SECONDS - T0)) -gt $((wallmin * 60)) ]; then
                echo "early-kill: wall $wallmin min" >> pnr.log; pkill -TERM -P $PID; break
              fi
            done
            wait $PID; echo "exit=$?" >> pnr.log
            echo "wall_s=$((SECONDS - T0)) $(grep -E 'Maximum resident' time.log | sed 's/^[[:space:]]*//')" >> pnr.log
            rm -f top.json
            if [ -f top.fasm ] && grep -q 'Routing complete' pnr.log; then   # bitgen here too, so no local compute is needed
              DB="$OXC/share/nextpnr/external/prjxray-db/artix7"; P=xc7a100tcsg324-1
              "$OXC/bin/fasm2frames" --db-root "$DB" --part $P top.fasm top.frames && \
                "$OXC/bin/xc7frames2bit" --part_file "$DB/$P/part.yaml" --part_name $P --frm_file top.frames --output_file top.bit
              rm -f top.frames; [ -f top.bit ] && gzip -9 top.bit
            fi
            rm -f top.fasm
          }
          set +e; n=0
          for S in $SEEDS; do
            ( one $S ) &
            n=$((n + 1)); [ $n -ge "$per_job" ] && { wait -n; n=$((n - 1)); }
          done
          wait
          for S in $SEEDS; do
            echo "== s$S: $(grep -E "^early-kill|^exit=|^wall_s=" s$S/pnr.log | tr '\n' ' ')"
            grep -E "Max frequency" s$S/pnr.log | tail -4
            [ -f s$S/top.bit.gz ] && echo "   bitstream: s$S/top.bit.gz"
          done
      - name: OSERDES input net delays (with --detailed-timing-report)
        if: ${{ always() && contains(inputs.extra, 'detailed-timing-report') }}
        run: |
          for d in out/s*/; do [ -f $d/report.json ] && python3 - $d/report.json <<'PY' | tee $d/oserdes_nets.txt; done
          import json, sys, collections
          r = json.load(open(sys.argv[1]))
          worst = collections.defaultdict(lambda: (0.0, ""))
          for n in r.get("detailed_net_timings", []):
              for e in n.get("endpoints", []):
                  port = e.get("port", "")
                  if port in ("T1",) or (len(port) == 2 and port[0] == "D" and port[1] in "12345678"):
                      d = float(e.get("delay", 0.0))
                      if d > worst[port][0]: worst[port] = (d, f'{n.get("net", "?")} -> {e.get("cell", "?")}')
          for port in sorted(worst): print(f"max route delay to OSERDES-type port {port}: {worst[port][0]:.3f} ns ({worst[port][1]})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ inputs.variant }}-g${{ steps.g.outputs.first }}
          path: |
            out/s*/pnr.log
            out/s*/time.log
            out/s*/report.json
            out/s*/oserdes_nets.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bit-${{ inputs.variant }}-g${{ steps.g.outputs.first }}
          path: out/s*/top.bit.gz
          retention-days: 7
          if-no-files-found: ignore
