name: pnr
on:
  workflow_dispatch:
    inputs:
      variant: { description: "nets/<variant>", required: true }
      seeds:   { description: "comma-separated seeds", required: true, default: "1" }
      freq:    { description: "target MHz", required: true, default: "62.5" }
      extra:   { description: "extra nextpnr options", required: false, default: "" }
      maxiter: { description: "kill the router after this many iterations (0 = never)", required: false, default: "60" }
      nextpnr: { description: "release = the openXC7 release binary; r43 = openXC7/nextpnr 8006fbc6f8f7 + patches/nextpnr-r43.patch, built here; np31 = r43 + patches/nextpnr-np31.patch (env-gated placer knobs)", required: false, default: "release" }
      npenv:   { description: "environment for nextpnr, e.g. NP_TMG_K=20 NP_TMG_CAP=0 (np31 knobs)", required: false, default: "" }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.s.outputs.seeds }}
    steps:
      - id: s
        env: { SEEDS: "${{ inputs.seeds }}" }
        run: echo "seeds=$(python3 -c 'import json,os; print(json.dumps([s.strip() for s in os.environ["SEEDS"].split(",") if s.strip()]))')" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    if: ${{ inputs.nextpnr == 'r43' || inputs.nextpnr == 'np31' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: patches
      - id: k
        env: { NPV: "${{ inputs.nextpnr }}" }
        run: |
          P=patches/nextpnr-r43.patch; [ "$NPV" = np31 ] && P="$P patches/nextpnr-np31.patch"
          echo "key=nextpnr-8006fbc6f8f7-$(cat $P | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: c
        with:
          path: /home/runner/npr
          key: ${{ steps.k.outputs.key }}
      - name: build nextpnr-xilinx (himbaechel) from public source + patch
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev libboost-system-dev libeigen3-dev ninja-build cmake
          git clone -q https://github.com/openXC7/nextpnr /tmp/nextpnr
          cd /tmp/nextpnr && git checkout -q 8006fbc6f8f7
          git apply "$GITHUB_WORKSPACE/patches/nextpnr-r43.patch"
          if [ "${{ inputs.nextpnr }}" = np31 ]; then git apply "$GITHUB_WORKSPACE/patches/nextpnr-np31.patch"; fi
          git diff --stat
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=himbaechel -DHIMBAECHEL_UARCH=xilinx \
            -DHIMBAECHEL_XILINX_DEVICES="" -DHIMBAECHEL_PRJXRAY_DB=/tmp/no-prjxray-db -DBUILD_PYTHON=OFF -DBUILD_GUI=OFF
          cmake --build build -j 4
          mkdir -p "/home/runner/npr" && cp build/nextpnr-himbaechel "/home/runner/npr/"
      - run: |
          sudo apt-get install -y -qq libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev > /dev/null
          ls -la /home/runner/npr && /home/runner/npr/nextpnr-himbaechel --version
  pnr:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJson(needs.plan.outputs.seeds) }}
    env:
      VARIANT: ${{ inputs.variant }}
      SEED: ${{ matrix.seed }}
      FREQ: ${{ inputs.freq }}
      EXTRA: ${{ inputs.extra }}
      MAXITER: ${{ inputs.maxiter }}
      NEXTPNR: ${{ inputs.nextpnr }}
      NPENV: ${{ inputs.npenv }}
      OXC: /home/runner/oxc
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nets/${{ inputs.variant }}
            patches
      - id: k
        if: ${{ inputs.nextpnr == 'r43' || inputs.nextpnr == 'np31' }}
        env: { NPV: "${{ inputs.nextpnr }}" }
        run: |
          P=patches/nextpnr-r43.patch; [ "$NPV" = np31 ] && P="$P patches/nextpnr-np31.patch"
          echo "key=nextpnr-8006fbc6f8f7-$(cat $P | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: ${{ inputs.nextpnr == 'r43' || inputs.nextpnr == 'np31' }}
        with:
          path: /home/runner/npr
          key: ${{ steps.k.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/cache@v4
        with:
          path: /home/runner/oxc
          key: openxc7-linux-x86-64-20261012
      - name: toolchain
        run: |
          if [ ! -x "$OXC/bin/nextpnr-xilinx" ]; then
            mkdir -p "$OXC"
            curl -sSL -o /tmp/oxc.tgz https://github.com/cavearr/toolchain-openxc7-releases/releases/download/2026-10-12/openxc7-toolchain-linux-x86-64-20261012.tgz
            echo "a0d583457dee3644fdca83e556a8106c58aba5fb88f23e30f1270f3a309d0ec8  /tmp/oxc.tgz" | sha256sum -c -
            tar -xzf /tmp/oxc.tgz -C "$OXC" && rm /tmp/oxc.tgz
          fi
          "$OXC/bin/nextpnr-xilinx" --version
          if [ "$NEXTPNR" != release ]; then sudo apt-get install -y -qq libboost-program-options1.83.0 libboost-iostreams1.83.0 libboost-thread1.83.0 libboost-filesystem1.83.0 >/dev/null 2>&1 || sudo apt-get install -y -qq libboost-program-options-dev libboost-iostreams-dev libboost-thread-dev libboost-filesystem-dev; "/home/runner/npr/nextpnr-himbaechel" --version; fi
      - name: place and route
        run: |
          mkdir -p out && cd out
          gunzip -c "../nets/$VARIANT/top.json.gz" > top.json
          cp "../nets/$VARIANT/pins.xdc" .
          set +e
          NPR="$OXC/bin/nextpnr-xilinx"; [ "$NEXTPNR" != release ] && NPR="/home/runner/npr/nextpnr-himbaechel"
          echo "binary: $NPR ($NEXTPNR) env: $NPENV" > pnr.log
          env $NPENV "$NPR" --device xc7a100tcsg324-1 \
            --chipdb "$OXC/share/nextpnr/himbaechel/xilinx/chipdb-xc7a100t.bin" \
            --json top.json --freq "$FREQ" --seed "$SEED" $EXTRA --timing-allow-fail \
            -o xdc=pins.xdc -o fasm=top.fasm --report report.json >> pnr.log 2>&1 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 20
            if [ "${MAXITER:-0}" -gt 0 ] && [ "$(grep -c ' wires=' pnr.log)" -gt "$MAXITER" ] && ! grep -q 'Routing complete' pnr.log; then
              echo "early-kill: router passed $MAXITER iterations" >> pnr.log; kill $PID; break
            fi
          done
          wait $PID
          echo "exit=$?" >> pnr.log
          rm -f top.json
          if [ -f top.fasm ]; then   # bitgen here too, so no local compute is needed
            DB="$OXC/share/nextpnr/external/prjxray-db/artix7"; P=xc7a100tcsg324-1
            "$OXC/bin/fasm2frames" --db-root "$DB" --part $P top.fasm top.frames && \
              "$OXC/bin/xc7frames2bit" --part_file "$DB/$P/part.yaml" --part_name $P --frm_file top.frames --output_file top.bit
            rm -f top.frames; [ -f top.bit ] && gzip -9 top.bit
          fi
          [ -f top.fasm ] && gzip -9 top.fasm
          grep -E "Max frequency" pnr.log | tail -4 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ inputs.variant }}-s${{ matrix.seed }}
          path: |
            out/pnr.log
            out/report.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnr-${{ inputs.variant }}-s${{ matrix.seed }}
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bit-${{ inputs.variant }}-s${{ matrix.seed }}
          path: out/top.bit.gz
          retention-days: 7
          if-no-files-found: ignore
